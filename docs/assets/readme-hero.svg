  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="87" fill="#A6D7C8" font-size="16" font-weight="600" letter-spacing="4">SAYSEE / VOICE TO CLARITY</text>
    <text x="76" y="170" fill="#F1F7F5" font-size="58" font-weight="650" letter-spacing="-2">Speak freely. Write clearly.</text>
    <text x="80" y="215" fill="#B1C9C6" font-size="22">Local transcription. Thoughtful refinement. Right where you type.</text>
    <rect x="80" y="278" width="302" height="172" rx="22" fill="#FFFFFF" fill-opacity=".06" stroke="#B6E3D6" stroke-opacity=".16"/>
    <text x="104" y="313" fill="#ACCAC2" font-size="12" letter-spacing="2">01 / SPEAK</text>
    <rect x="104" y="337" width="100" height="50" rx="25" fill="#142D30"/>
    <g fill="url(#accent)"><rect x="132" y="355" width="7" height="14" rx="3.5"/><rect x="149" y="345" width="7" height="34" rx="3.5"/><rect x="166" y="351" width="7" height="22" rx="3.5"/></g>
    <text x="104" y="421" fill="#EEF7F3" font-size="18">Press Fn. Say what you mean.</text>
    <path d="M401 364H433M424 355L433 364L424 373" stroke="#8AB7A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="452" y="278" width="302" height="172" rx="22" fill="#FFFFFF" fill-opacity=".06" stroke="#B6E3D6" stroke-opacity=".16"/>
    <text x="476" y="313" fill="#ACCAC2" font-size="12" letter-spacing="2">02 / REFINE</text>
    <circle cx="502" cy="362" r="18" stroke="#A1E8CE" stroke-opacity=".22" stroke-width="4"/>
    <path d="M502 344A18 18 0 0 1 520 362" stroke="#A1E8CE" stroke-width="4" stroke-linecap="round"/>
    <text x="476" y="421" fill="#EEF7F3" font-size="18">Less repetition. More structure.</text>
    <path d="M773 364H805M796 355L805 364L796 373" stroke="#8AB7A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="824" y="278" width="376" height="172" rx="22" fill="#D6F3E6"/>
    <text x="848" y="313" fill="#43665A" font-size="12" letter-spacing="2">03 / WRITE</text>
    <text x="848" y="354" fill="#193E34" font-size="19" font-weight="600">Your thoughts, ready to use.</text>
    <rect x="848" y="372" width="282" height="5" rx="2.5" fill="#7FAC98" fill-opacity=".6"/>
    <rect x="848" y="387" width="225" height="5" rx="2.5" fill="#7FAC98" fill-opacity=".4"/>
    <text x="848" y="421" fill="#43665A" font-size="17">Paste into your app or copy the result.</text>
